name: Owner API Preview Alias Check
on:
  push:
    branches:
      - 'feature/approved-ui-foundation'
  workflow_dispatch:
jobs:
  verify_preview_alias:
    runs-on: ubuntu-latest
    steps:
      - name: Verify permanent Cloudflare Pages branch alias
        run: |
          set -euo pipefail
          ALIAS="https://feature-owner-mobile-readonly-api-v1.smarthoreca.pages.dev"
          curl --fail --silent --show-error --location --max-time 20 \
            "$ALIAS/api/mobile/v1/health" -o /tmp/owner-health.json
          node -e "const r=require('/tmp/owner-health.json');if(r.success!==true||r.service!=='Smart Horeca Owner Mobile API'||r.version!=='v1')process.exit(1); console.log('Owner mobile API branch alias health is verified')"
