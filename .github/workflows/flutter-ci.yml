name: Flutter UI Checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

concurrency:
  group: owner-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners for design branch
        run: flutter create . --platforms=android,ios
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test
      - name: Build Android design preview APK
        run: flutter build apk --debug --dart-define=SH_ENABLE_DEMO=true
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Pilot uses existing PUBLIC Supabase client config from the site's
      # public auth-config.js (no service-role key and no upstream passwords).
      # Deploys no backend and does not touch anarsystem/main.
      # Scoped to this feature branch; production releases need a fresh review.
      - name: Build Android owner pilot APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-ui-foundation' }}
        env:
          PILOT_URL: https://1f6ac687.smarthoreca.pages.dev
          PUBLIC_SUPABASE_URL: https://izytdfkdpbhmyuizuuut.supabase.co
          PUBLIC_SUPABASE_KEY: sb_publishable_OODMzFTaHq6DIoorXb85nQ_2FfwBXAS
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=SH_ENABLE_DEMO=false \
            --dart-define="SH_API_BASE_URL=$PILOT_URL" \
            --dart-define="SH_SUPABASE_URL=$PUBLIC_SUPABASE_URL" \
            --dart-define="SH_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_SUPABASE_KEY"
      - name: Upload Android owner pilot APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-ui-foundation' }}
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Real-Data-Pilot
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
