name: Flutter UI Checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

concurrency:
  group: owner-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners for design branch
        run: flutter create . --platforms=android,ios
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test
      - name: Build Android design preview APK
        run: flutter build apk --debug --dart-define=SH_ENABLE_DEMO=true
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Live-data APK is deliberately opt-in. On feature branches only, and
      # only when the repository is explicitly configured for a pilot preview.
      - name: Build Android authenticated pilot APK
        if: ${{ github.event_name == 'push' && vars.SH_OWNER_PILOT_API_BASE_URL != '' }}
        env:
          PILOT_URL: ${{ vars.SH_OWNER_PILOT_API_BASE_URL }}
          PUBLIC_SUPABASE_URL: ${{ secrets.SH_OWNER_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ secrets.SH_OWNER_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$PILOT_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]; then
            echo "::error::Pilot API base URL must be an HTTPS origin without paths or query."
            exit 1
          fi
          if [[ -z "$PUBLIC_SUPABASE_URL" || -z "$PUBLIC_SUPABASE_KEY" ]]; then
            echo "::error::Missing public Supabase client settings for the pilot."
            exit 1
          fi
          flutter build apk --debug \
            --dart-define=SH_ENABLE_DEMO=false \
            --dart-define="SH_API_BASE_URL=${PILOT_URL%/}" \
            --dart-define="SH_SUPABASE_URL=$PUBLIC_SUPABASE_URL" \
            --dart-define="SH_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_SUPABASE_KEY"
      - name: Upload authenticated pilot APK
        if: ${{ github.event_name == 'push' && vars.SH_OWNER_PILOT_API_BASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Pilot
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
