name: Flutter UI Checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

concurrency:
  group: owner-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners for design branch
        run: flutter create . --platforms=android,ios
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test
      - name: Build Android design preview APK
        run: flutter build apk --debug --dart-define=SH_ENABLE_DEMO=true
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
