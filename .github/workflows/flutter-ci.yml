name: Flutter UI Checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

concurrency:
  group: owner-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners for design branch
        run: flutter create . --platforms=android,ios
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test
      - name: Verify real-data pilot API availability
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-ui-foundation' }}
        env:
          SH_PILOT_ORIGIN: https://7d177345.smarthoreca.pages.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 20 \
            "$SH_PILOT_ORIGIN/api/mobile/v1/health" -o /tmp/sh-owner-pilot-health.json
          node -e "const h=require('/tmp/sh-owner-pilot-health.json'); if(h.success!==true || h.service!=='Smart Horeca Owner Mobile API' || h.status!=='preview') process.exit(1)"
      - name: Build Android design preview APK
        run: flutter build apk --debug --dart-define=SH_ENABLE_DEMO=true
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Pilot APK uses public auth configuration, retrieved securely at build time.
      # It never embeds SH Server passwords or Supabase service-role credentials.
      - name: Build Android owner pilot APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-ui-foundation' }}
        env:
          SH_PILOT_ORIGIN: https://7d177345.smarthoreca.pages.dev
        run: |
          set -euo pipefail
          if [[ ! "$SH_PILOT_ORIGIN" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "::error::Verified Cloudflare Preview HTTPS origin required."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --max-time 20 \
            'https://raw.githubusercontent.com/Anar044/anarsystem/main/auth-config.js' \
            -o /tmp/sh-owner-public-auth-config.js
          node - <<'NODE'
          const fs = require('fs');
          const publicConfig = fs.readFileSync('/tmp/sh-owner-public-auth-config.js', 'utf8');
          const url = publicConfig.match(/url:\s*["'](https:\/\/[^"']+)["']/)?.[1];
          const key = publicConfig.match(/publishableKey:\s*["'](sb_publishable_[^"']+)["']/)?.[1];
          if (!url || !key) throw new Error('Public Supabase auth config missing');
          const defs = {
            SH_ENABLE_DEMO: 'false',
            SH_API_BASE_URL: process.env.SH_PILOT_ORIGIN,
            SH_SUPABASE_URL: url,
            SH_SUPABASE_PUBLISHABLE_KEY: key,
          };
          fs.writeFileSync('/tmp/sh-owner-pilot-defines.json', JSON.stringify(defs));
          NODE
          flutter build apk --debug --dart-define-from-file=/tmp/sh-owner-pilot-defines.json
      - name: Upload Android owner pilot APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/approved-ui-foundation' }}
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Horeca-Owner-Android-Real-Data-Pilot
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
