name: Flutter UI Checks

on:
  push:
    branches:
      - 'feature/**'
  pull_request:

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners for design branch
        run: flutter create . --platforms=android,ios
      - name: Fetch dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test
