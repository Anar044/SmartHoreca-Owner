name: SH Owner App Store Screenshot Pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/remove-demo-copy-store-assets-20261027
      - release/appstore-ipad-screens-privacy-20261027
    paths:
      - 'test/app_store_screenshots_test.dart'
      - '.github/workflows/app-store-screenshots.yml'
      - 'lib/ui/owner_components.dart'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch Dart/Flutter dependencies
        run: flutter pub get
      - name: Validate capture test
        run: flutter analyze test/app_store_screenshots_test.dart
      - name: Assert signed App Store UI contains no beta/demo labels
        run: |
          flutter test test/owner_app_store_release_test.dart \
            --dart-define=SH_ENABLE_DEMO=false
      - name: Fetch Space Grotesk into temporary CI font cache
        run: |
          mkdir -p build/store_font
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf' \
            --output build/store_font/SpaceGrotesk.ttf
          test -s build/store_font/SpaceGrotesk.ttf
          curl --fail --location --silent --show-error --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf' \
            --output build/store_font/NotoSans.ttf
          test -s build/store_font/NotoSans.ttf
          echo "Flutter SDK: $FLUTTER_ROOT"
          ICON_FONT="$(find "$FLUTTER_ROOT/bin/cache" -type f \
            -name 'MaterialIcons-Regular.otf' -print -quit)"
          test -n "$ICON_FONT"
          cp "$ICON_FONT" build/store_font/MaterialIcons-Regular.otf
      - name: Capture iPhone and 13-inch iPad Flutter UI at native resolutions
        run: |
          flutter test test/app_store_screenshots_test.dart \
            --dart-define=SH_STORE_CAPTURE=true \
            --reporter expanded
      - name: Install screenshot verifier
        run: python3 -m pip install --user Pillow
      - name: Verify all sixteen full-resolution opaque PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files=sorted(Path('build/app_store_screenshots').glob('*.png'))
          assert len(files)==16, f'Expected 16 PNGs, got {len(files)}'
          for path in files:
              data=path.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n', path
              width,height=struct.unpack('>II',data[16:24])
              expected=(2064,2752) if '2064x2752' in path.name else (1320,2868)
              assert (width,height)==expected, (path,width,height)
              # PNG color type 6 is RGBA; App Store PNG must be opaque:
              # check that alpha bytes represent opaque values only.
              from PIL import Image
              with Image.open(path) as im:
                  assert im.size==expected
                  if im.mode in ('RGBA','LA'):
                      assert im.getchannel('A').getextrema()==(255,255), path
              print(path, (width,height))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SH-Owner-App-Store-iPhone-iPad13-EN-RU
          path: build/app_store_screenshots/*.png
          if-no-files-found: error
          retention-days: 30
