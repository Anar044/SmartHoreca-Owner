name: smart_horeca_owner
description: Smart Horeca Owner - approved mobile design preview (Android/iOS).
publish_to: none
version: 0.1.2+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  http: ^1.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  google_fonts: ^6.3.3
  pdf: ^3.11.3
  printing: ^5.14.2
  record: ^6.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/brand/sh-owner-original.png
    - assets/brand/splash-dining-dark.jpg
    - assets/brand/splash-dining-light.jpg

# Exact approved transparent artwork for Android. Apple App Store requires
# fully opaque icons; the separate iOS asset only fills the exterior with navy.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/sh-owner-original.png
  image_path_ios: assets/brand/sh-owner-ios.png
  adaptive_icon_background: "#091827"
  adaptive_icon_foreground: assets/brand/sh-owner-adaptive.png
  min_sdk_android: 23

# Native startup view matches the approved dark Owner splash.
flutter_native_splash:
  color: "#F3F6FC"
  image: assets/brand/sh-owner-original.png
  color_dark: "#091827"
  image_dark: assets/brand/sh-owner-original.png
  android_12:
    color: "#F3F6FC"
    image: assets/brand/sh-owner-adaptive.png
    icon_background_color: "#091827"
  android: true
  ios: true
