name: smart_horeca_owner
description: Smart Horeca Owner - approved mobile design preview (Android/iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  http: ^1.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.3.0
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/brand/smart-horeca-logo.jpg

# Installed Android launcher icon derived from the approved Smart Horeca logo.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/smart-horeca-logo.jpg
  adaptive_icon_background: "#091827"
  adaptive_icon_foreground: assets/brand/smart-horeca-logo.jpg
  min_sdk_android: 23

# Native startup view matches the approved dark Owner splash.
flutter_native_splash:
  color: "#091827"
  image: assets/brand/smart-horeca-logo.jpg
  color_dark: "#091827"
  image_dark: assets/brand/smart-horeca-logo.jpg
  android_12:
    color: "#091827"
    image: assets/brand/smart-horeca-logo.jpg
    icon_background_color: "#091827"
  android: true
  ios: false
